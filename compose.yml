name: gamestats

# Local build.
# Start: docker compose up -d --build
#
# To run the published preview images instead, use compose.preview.yml.

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/gamestats.db
    volumes:
      - ./data:/data
    ports:
      - "${BACKEND_PORT:-8091}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
