name: gamestats

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/gamestats.db
      AGENT_API_KEY: ${AGENT_API_KEY:-change-me}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_ID: ${STEAM_ID:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      AGENT_STALE_SECONDS: ${AGENT_STALE_SECONDS:-180}
      STEAM_SYNC_MINUTES: ${STEAM_SYNC_MINUTES:-15}
      IGDB_SYNC_MINUTES: ${IGDB_SYNC_MINUTES:-60}
      INFLUX_EXPORT_MINUTES: ${INFLUX_EXPORT_MINUTES:-15}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    ports:
      - "${BACKEND_PORT:-8091}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
