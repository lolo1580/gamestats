name: Publish preview Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-preview.yml"
  workflow_run:
    workflows:
      - "Build Windows agent"
    types:
      - completed

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: docker-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image names and tags
        id: vars
        run: |
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          date_tag="preview-$(TZ=Europe/Paris date +%Y-%m-%d)-1"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "date_tag=$date_tag" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/$owner/gamestats-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/gamestats-frontend" >> "$GITHUB_OUTPUT"
          {
            echo "## Preview Docker images"
            echo ""
            echo "- \`ghcr.io/$owner/gamestats-backend:preview-latest\`"
            echo "- \`ghcr.io/$owner/gamestats-backend:$date_tag\`"
            echo "- \`ghcr.io/$owner/gamestats-frontend:preview-latest\`"
            echo "- \`ghcr.io/$owner/gamestats-frontend:$date_tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Include latest Windows agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p backend/downloads
          run_id="$(gh run list --workflow=agent-windows.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "No successful Windows agent run found; building without a bundled installer."
            exit 0
          fi
          if gh run download "$run_id" --name GameStatsAgent-windows --dir /tmp/agent-download; then
            cp /tmp/agent-download/GameStatsAgentSetup.exe backend/downloads/
            cp /tmp/agent-download/GameStatsAgent-portable.zip backend/downloads/
            echo "Bundled Windows agent from run $run_id."
          else
            echo "Unable to download the agent artifact; building without a bundled installer."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.vars.outputs.backend }}:preview-latest
            ${{ steps.vars.outputs.backend }}:${{ steps.vars.outputs.date_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=GameStats backend
          cache-from: type=gha,scope=gamestats-backend
          cache-to: type=gha,mode=max,scope=gamestats-backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.vars.outputs.frontend }}:preview-latest
            ${{ steps.vars.outputs.frontend }}:${{ steps.vars.outputs.date_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=GameStats frontend
          cache-from: type=gha,scope=gamestats-frontend
          cache-to: type=gha,mode=max,scope=gamestats-frontend
