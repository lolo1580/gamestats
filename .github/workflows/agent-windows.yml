name: Build Windows agent

on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent-windows/requirements.txt pyinstaller

      - name: Build executable
        working-directory: agent-windows
        run: python -m PyInstaller --noconfirm --clean GameStatsAgent.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        working-directory: agent-windows
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" |
            Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup compiler not found."
          }
          & $iscc.FullName installer.iss

      - name: Create portable archive
        working-directory: agent-windows
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\GameStatsAgent\*" `
            -DestinationPath "dist\GameStatsAgent-portable.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GameStatsAgent-windows
          path: |
            agent-windows/dist/GameStatsAgentSetup.exe
            agent-windows/dist/GameStatsAgent-portable.zip

      - name: Attach installer to tag release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent-windows/dist/GameStatsAgentSetup.exe
            agent-windows/dist/GameStatsAgent-portable.zip
